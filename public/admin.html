<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — Fila de Retornos</title>
<link rel="stylesheet" href="shared.css">
<style>
  .shell{max-width:760px;margin:0 auto;padding:26px 20px 60px;}
  h1{font-size:18px;margin:0 0 4px;}
  .shell > p{font-size:13px;color:var(--text-3);margin:0 0 22px;}
  .user-form{padding:18px 20px;margin-bottom:22px;}
  .user-form h2{font-size:14px;margin:0 0 14px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--text-3);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg-elevated);}
  td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .row-actions{display:flex;gap:6px;}
  .row-actions button{padding:5px 10px;font-size:11.5px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark"></span> Painel Admin</div>
  <div class="nav-actions">
    <span class="user-pill" id="whoami"></span>
    <a class="btn btn-sm" href="app.html">Ir para o app</a>
    <button class="btn btn-sm" id="btnLogout">Sair</button>
  </div>
</header>

<div class="shell">
  <h1>Gestão de usuários</h1>
  <p>Cadastre os logins da equipe. Cada pessoa só enxerga a própria fila de retornos.</p>

  <form class="card user-form" id="userForm">
    <h2 id="formTitle">Novo usuário</h2>
    <input type="hidden" id="f_id">
    <div class="field-row">
      <div class="field">
        <label for="f_nome">Nome</label>
        <input type="text" id="f_nome" placeholder="Ex: Felipe Mendes" required>
      </div>
      <div class="field">
        <label for="f_username">Login</label>
        <input type="text" id="f_username" placeholder="Ex: felipe" required>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f_password">Senha <span id="passwordHint" style="font-weight:400;color:var(--text-3);"></span></label>
        <input type="password" id="f_password" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="field">
        <label for="f_role">Papel</label>
        <select id="f_role">
          <option value="user">Usuário (fila própria)</option>
          <option value="admin">Admin (gerencia usuários)</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px;">
      <button type="submit" class="btn btn-primary" id="btnSalvar">Criar usuário</button>
      <button type="button" class="btn" id="btnCancelarEdicao" style="display:none;">Cancelar edição</button>
    </div>
  </form>

  <div class="card">
    <table>
      <thead><tr><th>Nome</th><th>Login</th><th>Papel</th><th>Criado em</th><th></th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>
<script src="admin.js"></script>
</body>
</html>
