<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fila de Retornos</title>
<link rel="stylesheet" href="shared.css">
<style>
  .shell{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}
  .search-wrap{position:relative;}
  .search-wrap input{width:220px;background:var(--bg-surface);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 12px;font-size:13px;}
  .chip-group{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-2);}
  .chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);}
  .tab{padding:9px 4px;margin-right:20px;font-size:13px;font-weight:600;color:var(--text-3);background:none;border:none;border-bottom:2px solid transparent;}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);}
  table{width:100%;border-collapse:collapse;min-width:880px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--text-3);padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg-elevated);white-space:nowrap;}
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:hover{background:var(--bg-elevated);}
  tbody td{padding:11px 14px;font-size:13px;vertical-align:middle;}
  tr.row-warning{background:var(--warn-bg);}
  tr.row-critical{background:var(--crit-bg);}
  .cell-sub{display:block;font-size:11px;color:var(--text-3);margin-top:2px;}
  .table-scroll{overflow-x:auto;}
  .actions{display:flex;gap:5px;justify-content:flex-end;}
  .act-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated-2);color:var(--text-2);}
  .act-btn:hover{border-color:var(--border-strong);color:var(--text);}
  .empty-state{padding:50px 20px;text-align:center;color:var(--text-3);font-size:13px;}

  .overlay{position:fixed;inset:0;background:rgba(6,9,15,.6);opacity:0;pointer-events:none;transition:opacity .15s;z-index:40;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .panel{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--bg-surface);border-left:1px solid var(--border);z-index:50;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;}
  .panel.open{transform:translateX(0);}
  .panel-head{padding:18px 20px;border-bottom:1px solid var(--border);}
  .panel-head h2{margin:0;font-size:15px;}
  .panel-body{padding:18px 20px;overflow-y:auto;flex:1;}
  .panel-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px;}
  .panel-foot .btn{flex:1;justify-content:center;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}

  .stage-track{position:relative;padding-left:18px;margin-bottom:18px;}
  .stage-track::before{content:'';position:absolute;left:3px;top:5px;bottom:10px;width:2px;background:var(--border-strong);}
  .stage-node{position:relative;margin-bottom:12px;font-size:12px;}
  .stage-dot{position:absolute;left:-18px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--accent-indigo);}
  .stage-node.warn .stage-dot{background:var(--warn-text);}
  .stage-node.ok .stage-dot{background:var(--ok-text);}
  .stage-label{font-weight:700;color:var(--text);}
  .stage-time{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);margin-left:8px;}
  .stage-obs{color:var(--text-2);margin:2px 0 0;}

  .modal-box{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(6,9,15,.6);}
  .modal-box.open{display:flex;}
  .modal-card{width:360px;max-width:92vw;padding:20px;}
  .modal-card h3{margin:0 0 12px;font-size:15px;}
  .modal-actions{display:flex;gap:8px;}
  .modal-actions .btn{flex:1;justify-content:center;}
  .snooze-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .snooze-row button{flex:1;min-width:64px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-mark"></span> Fila de Retornos</div>
  <div class="nav-actions">
    <div class="search-wrap"><input type="text" id="searchInput" placeholder="Buscar por nome ou motivo…"></div>
    <button class="btn btn-primary" id="btnNovo">+ Novo Retorno</button>
    <span class="user-pill" id="whoami"></span>
    <a class="btn btn-sm" id="linkAdmin" href="admin.html" style="display:none;">Painel Admin</a>
    <button class="btn btn-sm" id="btnLogout">Sair</button>
  </div>
</header>

<div class="shell">
  <div class="chip-group" id="motivoChips"></div>

  <nav class="tabs">
    <button class="tab active" data-tab="Pendente">Pendentes <span id="countPendentes">0</span></button>
    <button class="tab" data-tab="Concluido">Histórico <span id="countHistorico">0</span></button>
  </nav>

  <div class="card">
    <div class="table-scroll">
      <table>
        <thead><tr id="theadRow"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">Nada por aqui ainda.</div>
  </div>
</div>

<!-- Painel lateral: criar/editar -->
<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel">
  <div class="panel-head"><h2 id="panelTitle">Novo Retorno</h2></div>
  <form class="panel-body" id="taskForm">
    <input type="hidden" id="f_id">
    <div id="historyWrap"></div>
    <div class="field"><label>ID da Empresa *</label><input type="text" id="f_empresa_id" required></div>
    <div class="field"><label>Nome do cliente *</label><input type="text" id="f_nome" required></div>
    <div class="field-row">
      <div class="field"><label>Motivo *</label>
        <select id="f_motivo" required>
          <option>Financeiro</option><option>Suporte</option><option>Homologação</option><option>Dúvidas</option><option>Outros</option>
        </select>
      </div>
      <div class="field"><label>Data / Hora *</label><input type="datetime-local" id="f_data_hora" required></div>
    </div>
    <div class="field"><label>Link do chat</label><input type="url" id="f_link_chat" placeholder="https://wa.me/55..."></div>
    <div class="field"><label>Link do chamado/ticket</label><input type="url" id="f_link_ticket"></div>
    <div class="field"><label>Situação inicial (opcional)</label>
      <select id="f_pendencia">
        <option value="">Nenhuma — retorno novo</option>
        <option>Aguardando outro setor</option>
        <option>Aguardando devolutiva do cliente</option>
        <option>Aguardando aprovação interna</option>
        <option>Outro</option>
      </select>
    </div>
    <div class="field"><label>Anotações</label><textarea id="f_anotacoes"></textarea></div>
  </form>
  <div class="panel-foot">
    <button type="button" class="btn" id="btnCancelar">Cancelar</button>
    <button type="submit" form="taskForm" class="btn btn-primary" id="btnSalvar">Salvar</button>
  </div>
</aside>

<!-- Diálogo: concluir/adiar definitivo ou não -->
<div class="modal-box" id="actionBox">
  <div class="card modal-card">
    <h3 id="actionTitle">Concluir retorno</h3>
    <div id="actionStep1">
      <p class="hint" id="actionQuestion" style="margin-bottom:14px;">Isso é definitivo?</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="actionYes">Sim</button>
        <button class="btn" id="actionNo">Não, é atualização</button>
      </div>
    </div>
    <div id="actionStep1b" style="display:none;">
      <div class="snooze-row">
        <button class="btn btn-sm" data-min="15">+15 min</button>
        <button class="btn btn-sm" data-min="30">+30 min</button>
        <button class="btn btn-sm" data-min="60">+1 h</button>
        <button class="btn btn-sm" data-min="1440">Amanhã</button>
      </div>
      <button class="btn btn-sm" id="actionBack1b">Voltar</button>
    </div>
    <div id="actionStep2" style="display:none;">
      <div class="field"><label>Motivo</label>
        <select id="actionMotivo">
          <option>Aguardando outro setor</option>
          <option>Aguardando devolutiva do cliente</option>
          <option>Aguardando aprovação interna</option>
          <option>Outro</option>
        </select>
      </div>
      <div class="field"><label>Observação (opcional)</label><textarea id="actionObs"></textarea></div>
      <div class="field"><label>Novo horário</label><input type="datetime-local" id="actionNovaData"></div>
      <div class="modal-actions">
        <button class="btn" id="actionBack2">Voltar</button>
        <button class="btn btn-primary" id="actionConfirm">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>
<script src="app.js"></script>
</body>
</html>
